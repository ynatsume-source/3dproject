name: Cord worksite preview
on:
  pull_request:
    paths:
      - '.github/workflows/cord-worksite-preview.yml'
      - 'docs/proposals/cord-worksite-preview/**'
      - 'tools/prototypes/cord-worksite-template.html'
      - 'scripts/cord-worksite*'
      - 'src/world/prototypes/cord-workflow.ts'
      - 'src/science/prototypes/coconut-husk.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Validate immutable fixture projections and static preview
        run: node --import tsx --import ./scripts/node-assets.mjs scripts/cord-worksite-check.ts
      - name: Render desktop and landscape phone states
        run: node scripts/cord-worksite-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cord-worksite-preview
          path: check-results/cord-worksite
          retention-days: 14
