name: Headless checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: Checks to run
        type: choice
        options: [all, fast, slow]
        default: all

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  fast:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.group != 'slow')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: install
        run: npm ci
      - name: Check complete manifest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/checks.mjs all --list
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Fast headless checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/checks.mjs fast --out check-results/fast
      - name: Show science check evidence
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          const names = new Set(['sail-raft-checkpoint', 'sail-inputs', 'sail-lots',
            'sail-work', 'sail-voyage', 'sail-cord-settlement',
            'husk-soak', 'husk-host', 'science-records', 'manual-husk-records',
            'coir-cord-work', 'husk-soak-records', 'husk-soak-batch']);
          const resultsFile = 'check-results/fast/results.json';
          if (existsSync(resultsFile)) {
            for (const result of JSON.parse(readFileSync(resultsFile, 'utf8'))) {
              if (!['passed', 'completed'].includes(result.status)) names.add(result.name);
            }
          }
          for (const name of names) {
            const file = 'check-results/fast/' + name + '.log';
            if (existsSync(file)) console.log(file + '\n' + readFileSync(file, 'utf8'));
          }
          JS
      - name: Show cord load check evidence
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          const names = new Set(['cord-load-compaction', 'coir-cord-load',
            'coir-cord-identity', 'cord-integer-load']);
          const file = 'check-results/fast/results.json';
          if (existsSync(file)) {
            for (const result of JSON.parse(readFileSync(file, 'utf8'))) {
              if (!['passed', 'completed'].includes(result.status)) names.add(result.name);
            }
          }
          for (const name of names) {
            const log = 'check-results/fast/' + name + '.log';
            if (existsSync(log)) console.log(log + '\n' + readFileSync(log, 'utf8'));
          }
          JS
      - name: Keep check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-fast
          path: check-results/fast
          if-no-files-found: warn
          retention-days: 14

  slow:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.group != 'fast')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Slow headless checks (full default coverage)
        run: node scripts/checks.mjs slow --shard ${{ matrix.shard }}/4 --out check-results/slow-${{ matrix.shard }}
      - name: Keep check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-slow-${{ matrix.shard }}
          path: check-results/slow-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 14
