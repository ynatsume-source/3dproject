name: Backup to Google Drive

# Once a day (03:15 in Japan), on days the repository changed, a git bundle of the whole history is put in
# Google Drive (folder Utsushiyo-backup). See docs/BACKUP.md for the one-time setup and how to restore.
on:
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Anything new today?
        id: check
        env:
          HAS_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then echo "No RCLONE_DRIVE_TOKEN secret yet: skipping (see docs/BACKUP.md)"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(git log --since='25 hours ago' --oneline | wc -l)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$n" -gt 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "No commits in the last day: nothing to back up"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Bundle
        if: steps.check.outputs.go == 'true'
        run: |
          name="utsushiyo-$(TZ=Asia/Tokyo date +%Y-%m-%d).bundle"
          git bundle create "$name" --all
          git bundle verify "$name"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: Upload to Google Drive
        if: steps.check.outputs.go == 'true'
        env:
          TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone
          printf '[gdrive]\ntype = drive\nscope = drive\ntoken = %s\n' "$TOKEN" > ~/.config/rclone/rclone.conf
          rclone copy "$NAME" gdrive:Utsushiyo-backup/
          # keep two months of dailies, and the first of every month for good
          rclone delete gdrive:Utsushiyo-backup/ --min-age 60d --exclude '*-01.bundle'
          rclone ls gdrive:Utsushiyo-backup/ | tail -5
