<style>
@font-face{font-family:ReviewJP;src:url(data:font/woff;base64,__FONT__) format('woff');font-weight:100 900;font-display:block}

footer{position:absolute;bottom:0;left:0;right:0;background:#f7f4e7;padding:5px 18px}#summary{display:grid;grid-template-columns:1fr 1fr;column-gap:24px;grid-auto-rows:28px}#summary p{margin:0;font-size:18px;line-height:28px;white-space:nowrap}#summary strong{font-weight:650}#summary .key{color:#64766b;font-weight:400}#details{display:flex;gap:18px;border-top:1px solid #b6c2af;margin-top:4px;padding-top:4px}#details p{margin:0;font-size:15px;line-height:24px;white-space:nowrap}.future{color:#786a52}
.tag{position:absolute;background:#f7f4e7;border:1px solid #526e60;border-radius:6px;padding:2px 7px;font-size:16px;line-height:20px;white-space:nowrap}.tag.a{left:29%;top:44%}.tag.b{left:63%;top:48%}#dot{transition:none}
@media(max-width:850px){header{height:24px;padding:0 9px;font-size:14px}header .desktop{display:none}nav{gap:3px}button{height:24px;min-width:25px;padding:0 5px;font-size:14px}select{font-size:14px;width:220px;max-width:220px}footer{padding:2px 10px}#summary{column-gap:12px;grid-auto-rows:21px}#summary p{font-size:14px;line-height:21px}#details{margin-top:0;padding-top:0;border-top:0;gap:12px}#details p{font-size:14px;line-height:21px}.tag{font-size:14px;padding:1px 5px;line-height:18px}}
</style>

<g transform="translate(130 478)"><use href="#palm"/></g><g transform="translate(1120 360) scale(.85)"><use href="#palm"/></g><g transform="translate(1210 412) scale(.65)"><use href="#palm"/></g>
<ellipse cx="405" cy="495" rx="125" ry="38" fill="#6f7853" opacity=".17" filter="url(#shadow)"/>

<g id="bench"><path d="M727 451v73M924 459v74M794 488v66" stroke="#795e45" stroke-width="14"/><path d="M695 421l136-44 150 61-140 54Z" fill="#ad875d" stroke="#735e44" stroke-width="3"/><path d="M695 421v16l146 68v-13M841 505l140-52v-15" fill="#866e4f"/><path d="M742 409l145 66M790 393l144 64" stroke="#cfab79" stroke-width="2"/><ellipse cx="830" cy="430" rx="27" ry="12" fill="#846044"/><path d="M878 409l35 16" stroke="#686952" stroke-width="10" stroke-linecap="round"/></g>

</svg>
<header data-occluder><strong>縄づくり／模式図<span class="desktop">・読取専用</span></strong><nav aria-label="保存状態の切替"><button id="prev" aria-label="前の保存状態">‹</button><select id="states" aria-label="表示する保存状態"></select><button id="next" aria-label="次の保存状態">›</button><button id="details-toggle" aria-expanded="false" aria-controls="details">詳細</button></nav></header>
<div class="tag a" data-occluder aria-label="浸漬容器A">A</div><div class="tag b" data-occluder aria-label="作業台B">B</div>
<footer data-occluder aria-live="polite"><div id="summary">
<p><span class="key">A：</span><strong id="current"></strong></p><p><strong id="parallel"></strong></p>
<p><span class="key">状態：</span><strong id="reason"></strong></p><p><span class="key">次：</span><strong id="following"></strong></p>
</div><div id="details" hidden><p id="eta"></p><p class="future">乾燥・撚り・完成縄は未実装</p></div></footer>
</main>
<script>
'use strict';
const freeze=o=>{if(o&&typeof o==='object'){Object.values(o).forEach(freeze);Object.freeze(o);}return o;};
const frames=freeze(__FRAMES__);let selected=0;
const $=id=>document.getElementById(id);const states=$('states');
for(const f of frames){const o=document.createElement('option');o.value=f.id;o.textContent=f.label;states.append(o);}
function render(index){selected=(index+frames.length)%frames.length;const f=frames[selected],a=f.jobs.find(j=>j.id==='a'),b=f.jobs.find(j=>j.id==='b');states.value=f.id;
 const phase=a?.phase,hasFiber=!!a?.next.startsWith('試験繊維');
 $('current').textContent=f.error?'水不足・開始前':phase==='soaking'?'浸して待つ':phase==='working'?'回収の手作業中':phase==='recovered'?'回収済み・縄は未完成':a?.stopReason?'中断・続きは保持':'取り出して確認へ';
 $('eta').textContent=f.error?'材料が揃うまで開始しない':phase==='recovered'?'回収物を確認・完成縄なし':'自然処理の完了時刻：不明';
 $('parallel').textContent=b?.actor?'ドット：Bで手作業':a?.actor?'ドット：Aで手作業':'ドット：手は空いている';
 $('reason').textContent=f.error?'水が揃わず開始できない':a?.stopReason?'中断・続きあり':phase==='recovered'?'縄は未完成':b?.actor?'Aは待機・Bは作業':a?.actor?'一区切りで手を離せる':'完成未確認・手は空いている';
 $('following').textContent=f.error?'水を用意して再検討':phase==='recovered'?'回収物を見て次を検討':phase==='working'?'一区切りで続きへ':a?.stopReason?'残りの手作業を再開':'戻って取り出し・確認';
 $('dot').setAttribute('transform',b?.actor?'translate(875 510)':a?.actor?'translate(520 470)':'translate(650 550)');
 $('water').style.display=f.error?'none':'';$('husks').style.display=f.error||phase==='recovered'?'none':'';$('fiber').style.display=phase==='recovered'&&hasFiber?'':'none';
 document.documentElement.dataset.state=f.id;
}
function showDetails(open){$('details').hidden=!open;$('details-toggle').setAttribute('aria-expanded',String(open));$('details-toggle').textContent=open?'閉じる':'詳細';}
$('details-toggle').addEventListener('click',()=>showDetails($('details').hidden));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('details').hidden){showDetails(false);$('details-toggle').focus();}});
states.addEventListener('change',()=>render(frames.findIndex(f=>f.id===states.value)));
$('prev').addEventListener('click',()=>render(selected-1));$('next').addEventListener('click',()=>render(selected+1));
window.worksiteReview=Object.freeze({snapshot:()=>JSON.stringify(frames),get selected(){return frames[selected].id;}});render(0);
</script></html>
