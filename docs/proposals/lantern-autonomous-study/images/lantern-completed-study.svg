<text x="48" y="1028" font-size="9" fill="#526b6c">雲量 8%（シミュレーション設定） · 作中進行中の記録</text>
<text x="48" y="1050" font-size="10" fill="#526b6c">ランタンのことば（創作）</text>
<text x="48" y="1072" font-size="13">もう一度見た空を、前の記録と並べた。星の並びを、これからも確かめてい</text>
<text x="48" y="1090" font-size="13">きたい。</text>
<path d="M48 1121H792" stroke="#b8c1b8"/>
<text x="48" y="1142" font-size="10">作中の観察にもとづく計算図です。現地の実測・撮影記録ではありません。</text>
<text x="48" y="1160" font-size="9" fill="#526b6c">恒星: d3-celestial / Yale catalogue (J2000) · 歳差・大気差・地形遮蔽を省いた概略位置</text>
<text x="48" y="1176" font-size="9" fill="#526b6c">星の位置は計算値です。雲による個々の星の遮蔽は検証していません。</text>
