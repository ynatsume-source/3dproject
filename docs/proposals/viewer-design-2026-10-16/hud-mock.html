<!doctype html>
<!-- ライブの HUD の大きさを確かめるためのモック（2026-10-17）。アプリのコードではない。
     1920×1080 で描き、スマホ幅に縮めた画像で読めるかを見る。背景は 10/11 に撮った画面（ソフトウェア描画、いまのアプリの HUD が写り込んでいる）を引き伸ばしたもの。状態の文の「ヤシの殻を打っている」は仮（殻と縄はまだ接続されていない）。
     #day / #night、&step（縄づくりの段階の並びを出す）、&grid（端から5%・10%の目盛り）、&notext（文字を消して帯だけ：明るさの比を測る用） -->
<html lang="ja"><head><meta charset="utf-8"><title>live HUD mock</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: "Zen Kaku Gothic New", "Noto Sans CJK JP", "Noto Sans JP", sans-serif; }
  .bg { position: absolute; inset: 0; background: center/cover no-repeat; }
  .hud { position: absolute; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.55); letter-spacing: .02em; }
  .band { background: rgba(2, 12, 16, .62); border-radius: 18px; padding: 14px 30px 18px; }
  #main { left: 96px; bottom: 120px; max-width: 1536px; }
  #view { font-size: 56px; font-weight: 500; opacity: .92; margin-bottom: 6px; }
  #step { font-size: 48px; margin-bottom: 8px; }
  #step b { font-weight: 700; color: #ffe08a; }
  #step s { opacity: .85; }
  #step .done { color: #a8e6d8; } #step .todo { opacity: .85; }
  #status { font-size: 72px; font-weight: 700; line-height: 1.15; }
  #time { right: 96px; top: 64px; font-size: 48px; font-weight: 500; }
  #ai { right: 96px; top: 158px; font-size: 40px; }
  .grid { position: absolute; inset: 0; pointer-events: none; }
  .grid i { position: absolute; border: 2px dashed rgba(255, 80, 80, .8); }
  .notext .hud, .notext .hud * { color: transparent !important; text-shadow: none !important; }
</style></head><body>
<div class="bg" id="bg"></div>
<div class="hud" id="time"><span class="band">島暦1年 6月1日 ・ 19:42</span></div>
<div class="hud band" id="main">
  <div id="view">ドット ・ ドロン01</div>
  <div id="step" hidden>縄づくり　<span class="done">浸ける・</span><b>打つ</b><span class="todo">・乾かす・<s>振るう</s>・撚る・縒る</span></div>
  <div id="status">作業台で流木を部材に削っている</div>
</div>
<div class="hud" id="ai"><span class="band">住人はAIです ・ 映像は自動で撮影しています</span></div>
<div class="grid" id="grid" hidden>
  <i style="left:5%;top:5%;right:5%;bottom:5%"></i><i style="left:10%;top:10%;right:10%;bottom:10%"></i>
</div>
<script>
  const h = location.hash.slice(1).split('&');
  const night = h.includes('night');
  const $ = (id) => document.getElementById(id), status = $('status'), view = $('view'), time = $('time'), step = $('step'), grid = $('grid');
  document.getElementById('bg').style.backgroundImage = `url(../viewer-design-2026-10-11/${night ? 'now-7-pc-night-lantern.jpg' : 'now-6-pc-day.jpg'})`;
  if (night) { view.textContent = 'ランタン ・ ドロン02'; status.textContent = '丘の上で星を見て考えごとをしている'; time.firstChild.textContent = '島暦1年 6月1日 ・ 23:10'; }
  if (h.includes('step')) { step.hidden = false; view.textContent = 'ラッコ ・ ドロン04'; status.textContent = 'ヤシの殻を打っている'; }
  if (h.includes('grid')) grid.hidden = false;
  if (h.includes('notext')) document.body.classList.add('notext');
</script>
</body></html>
