<!doctype html>
<!-- X のヘッダー（2026-10-25）：3:1。島の画（アプリの表示なし）に、右下へ小さく UTSUSHIYO PROJECT ／ Series 1 ルマウ。
     左下はプロフィール画像が重なるので、何も置かない。?bg=画像のファイル名&y=切り出す位置（%）。
     画はソフトウェア描画の仮の画。実機のリハーサル（本物の GPU）の録画から撮り直して差し替える。 -->
<html><head><meta charset="utf-8"><title>header</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Cormorant+SC:wght@500&family=Zen+Old+Mincho:wght@500&display=block">
<style>
  html, body { margin: 0; width: 1500px; height: 500px; overflow: hidden; background: #061218; }
  .bg { position: absolute; inset: 0; background-size: cover; background-repeat: no-repeat; }
  .brand { position: absolute; right: 64px; bottom: 58px; text-align: right; color: rgba(248, 245, 238, .92);
    text-shadow: 0 0 2px rgba(0,0,0,.45), 0 1px 12px rgba(0,0,0,.35); }
  .n { font: 500 26px/1 "Cormorant SC", serif; letter-spacing: .3em; margin-right: -.3em; }
  .s { margin-top: 12px; font: 500 24px/1 "Zen Old Mincho", serif; letter-spacing: .24em; margin-right: -.24em; color: rgba(246, 243, 236, .84); }
  .s i { font: italic 500 24px/1 "Cormorant Garamond", serif; font-variant-numeric: lining-nums; letter-spacing: .06em; margin-right: .6em; color: rgba(246, 243, 236, .7); }
</style></head><body>
<div class="bg" id="bg"></div>
<div class="brand"><div class="n">UTSUSHIYO PROJECT</div><div class="s"><i>Series 1</i>ルマウ</div></div>
<script>
  const q = new URLSearchParams(location.search);
  const bg = document.getElementById('bg');
  bg.style.backgroundImage = `url(${q.get('bg') || 'header-bg.jpg'})`;
  bg.style.backgroundPosition = `50% ${q.get('y') || '50'}%`;
</script>
</body></html>
