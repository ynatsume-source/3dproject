<!doctype html>
<!-- ライブ配信の画面案「観測の窓」第2版（横 1920×1080、2026-10-17）。アプリのコードではない、設計のモック。
     背景は utsushiyo.earth の #planet をソフトウェア描画で撮った画（アプリの表示を消したもの）。実際の GPU の画とは色や細かさが違う。
     場面：#day #rope #isle #night #talk #milestone、#fire #bubble（R-024 の吹き出し。背景は main 32638a3 のビルド、住人の位置はモックのために置いた）。言語：既定は日本語、&en で英語の型（英語の文は islandlang.ts にある会話の訳のほかは仮）。
     &notext で文字を消し、背景と曇りだけ（明るさの比を測る用）。
     文言：状態の文・出来事の文・会話は residents.ts / islandlang.ts にある文をそのまま使う。「ヤシの殻を打っている」は仮（殻と縄はまだ接続されていない）。
     日付・時刻は仮。節目の場面の灯りの光はモックのために描き足したもの（実際の見た目は自然班）。 -->
<html lang="ja"><head><meta charset="utf-8"><title>live screens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cormorant+SC:wght@500;600&family=IBM+Plex+Mono:wght@400&family=Zen+Kaku+Gothic+New:wght@500&family=Zen+Old+Mincho:wght@500;600;700&display=block">
<style>
  /* The type scale, from the frame up (1080 px high; see README §3):
     s1 22 · s2 26 · s3 32 · s4 40 · s5 46 · s6 56  — about 1.2 a step. On a phone held sideways (the frame ≈ 390 px high)
     these are ≈ 8 · 9 · 12 · 14 · 17 · 20 px; on a 1080p screen, as written. */
  :root {
    --s1: 22px; --s2: 26px; --s3: 32px; --s4: 40px; --s5: 46px; --s6: 56px;
    --ink: rgba(248, 245, 238, .97);      /* warm white, not quite opaque: the scene shows a little through */

    --shade: 6, 12, 14;
    --jp: "Zen Old Mincho", serif;
    --lat: "Cormorant Garamond", "Zen Old Mincho", serif;
    --caps: "Cormorant SC", serif;
    --mono: "IBM Plex Mono", monospace;
    --text: var(--jp);
    /* how much the scene is dimmed under the words: little, and less where it is already dark (the app measures it) */
    --pa: .34; --pb: .74; --blur: 6px;
  }
  .en { --text: var(--lat); font-variant-numeric: lining-nums; }
  body.mid { --pa: .1; --pb: .92; }
  body.dim { --pa: 0; --pb: 1; --blur: 0px; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; color: var(--ink); }
  .bg { position: absolute; inset: 0; background: center/cover no-repeat; }
  [hidden] { display: none !important; }

  /* words carry their own soft shadow; under them, a faint smoked glass whose edges dissolve — barely there */
  .t { text-shadow: 0 0 2px rgba(0, 0, 0, .5), 0 0 6px rgba(0, 0, 0, .34), 0 1px 14px rgba(0, 0, 0, .3); }
  .plate { position: absolute; pointer-events: none;
    background: rgba(var(--shade), var(--pa)); -webkit-backdrop-filter: blur(var(--blur)) brightness(var(--pb)); backdrop-filter: blur(var(--blur)) brightness(var(--pb));
    /* a bell, not a disc: no edge anywhere for the eye to find */
    -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 0%, rgba(0,0,0,.88) 26%, rgba(0,0,0,.5) 55%, rgba(0,0,0,.16) 78%, transparent 100%);
    mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 0%, rgba(0,0,0,.88) 26%, rgba(0,0,0,.5) 55%, rgba(0,0,0,.16) 78%, transparent 100%); }
  .plate.top { background: rgba(var(--shade), calc(var(--pa) * .7)); -webkit-backdrop-filter: brightness(calc(var(--pb) + .08)); backdrop-filter: brightness(calc(var(--pb) + .08)); }

  #brand .ser { font: italic 500 var(--s2)/1 var(--lat); font-variant-numeric: lining-nums; letter-spacing: .06em; margin-right: .7em; color: var(--ink3); }

  /* why (R-009 1): one quiet line under what it is doing — the resident's own aim, in the world's words */

  #roster .r .nm { width: 5.2em; color: var(--ink3); }
  #roster .r.on, #roster .r.on .nm { color: var(--ink); }
  #roster .r.on .c { width: 22px; opacity: 1; margin-right: 0; }
  /* Lantern's thinking (R-011): its own words, spun slowly at the left — not a subtitle: no island letters, smaller, quieter,

  #think { position: absolute; left: 96px; top: 372px; width: 470px; }
  #think .hd { display: flex; align-items: center; gap: 12px; font: 500 var(--s1)/1 var(--text); letter-spacing: .18em; color: var(--ink3); margin-bottom: 18px; }

  /* night: the sea as the main view, the one awake in a small window at the lower right (D24, NIGHT.md) */
  #pip { position: absolute; right: 96px; bottom: 136px; width: 512px; height: 288px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(246, 243, 236, .32), 0 6px 28px rgba(0, 0, 0, .45); }

  #pip .w svg { height: 18px; color: #9fe8ff; }
  #pip .w .c { width: 22px; height: 2px; background: #9fe8ff; }
  #pip .st { margin-top: 10px; font: 500 var(--s2)/1.3 var(--text); letter-spacing: .06em; color: var(--ink); }
  /* Lantern's map (R-005): under the date, the fog cleared where it has walked; no number on it */
  #map { position: absolute; right: 96px; top: 160px; width: 240px; height: 240px; box-shadow: 0 0 0 1px rgba(246, 243, 236, .32), 0 6px 24px rgba(0, 0, 0, .4); }
  #map img { width: 100%; height: 100%; display: block; }
  #map .lb { position: absolute; right: 0; top: calc(100% + 12px); font: 500 var(--s1)/1 var(--text); letter-spacing: .2em; color: var(--ink2); white-space: nowrap; }
  #rh { position: absolute; right: 96px; bottom: 86px; font: 400 var(--s1)/1 var(--mono); letter-spacing: .04em; color: var(--ink3); }
  /* R-024 (BUBBLE.md): what is said, over the speaker's head — the campfire demo's bubble, sized for the stream */
  .bub { position: absolute; --bgc: rgba(251, 248, 241, .96); background: var(--bgc); color: #23343a; border-radius: 24px; padding: 18px 26px 18px; width: max-content; max-width: 690px; min-width: 220px; box-sizing: border-box;
    box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 70%, transparent), 0 14px 36px rgba(0, 0, 0, .35); }

  .bub .nm { font: 700 var(--s1)/1 var(--jp); letter-spacing: .1em; color: color-mix(in srgb, var(--c) 50%, #23343a); }
  .bub .g { margin-top: 10px; line-height: 0; color: rgba(35, 52, 58, .8); }
  .bub .g svg { height: 30px; width: auto; max-width: 100%; }
  .bub .tr { margin-top: 10px; padding-top: 10px; border-top: 1.5px dashed color-mix(in srgb, var(--c) 60%, transparent); font: 600 var(--s4)/1.45 var(--jp); letter-spacing: .04em; max-width: 630px; }
  .bub .tr span { display: block; }
  .en .bub .nm { font: 600 var(--s2)/1 var(--lat); letter-spacing: .06em; }
  .en .bub .tr { font: 500 calc(var(--s4) + 4px)/1.3 var(--lat); letter-spacing: .01em; }
  /* v3 (PROGRAM.md §1-§2): where the island is heading, always — the chapter (the way's present stage), its day, the way;
     and at the top right what comes next on the island's day */
  #chap { position: absolute; left: 96px; top: 160px; }
  #chap .c1 { font: 600 var(--s4)/1 var(--text); letter-spacing: .08em; }
  #chap .c1 .no { font: 500 var(--s2)/1 var(--text); letter-spacing: .2em; color: var(--sand); margin-right: 22px; }
  #chap .c1 .dy { font: 500 var(--s1)/1 var(--text); letter-spacing: .1em; color: var(--ink3); margin-left: 16px; }
  #chap .way { margin-top: 18px; font: 500 var(--s2)/1 var(--text); letter-spacing: .08em; color: var(--ink2); }
  #chap .way .done { color: var(--done); } #chap .way .now { color: var(--sand); border-bottom: 1px solid var(--sand); padding-bottom: 3px; } #chap .way .dot { color: var(--ink3); margin: 0 10px; } #chap .way .later { color: var(--ink3); }
  .en #chap .c1 { font-size: calc(var(--s4) + 4px); letter-spacing: .02em; } .en #chap .c1 .no { font: italic 500 calc(var(--s2) + 2px)/1 var(--lat); letter-spacing: .04em; }
  #next { position: absolute; right: 96px; top: 150px; text-align: right; font: 500 var(--s2)/1 var(--text); letter-spacing: .1em; }
  #next .k { font: 500 var(--s1)/1 var(--text); letter-spacing: .2em; color: var(--sand); margin-right: 16px; }
  #next .tm { font: 400 var(--s2)/1 var(--mono); letter-spacing: .04em; margin-right: 12px; }
  #lower .why .lab { font: 500 var(--s1)/1 var(--text); letter-spacing: .2em; color: var(--sand); margin-right: 16px; vertical-align: 3px; }
  #lower .why .lab.no { color: var(--ink3); }
  .en #lower .why .lab { font: italic 500 var(--s2)/1 var(--lat); letter-spacing: .04em; }
  body.v3 #roster { top: 270px; } body.v3 #map { top: 210px; } body.v3 #think { top: 450px; }
  .bub.old { opacity: .55; box-shadow: none; transform: scale(.92); transform-origin: var(--tail, 50%) calc(100% + 16px); }
  .notext .t, .notext .t * { color: transparent !important; text-shadow: none !important; border-color: transparent !important; background-color: transparent !important; }
  .notext svg { visibility: hidden; }

<script>
// The island's letters (as src/robots/islandlang.ts draws them: one sign a syllable — a consonant's shape and its vowel's mark).
const BASE = { '': '<circle cx="5" cy="8" r="3"/>', p: '<path d="M5 3V13"/>', t: '<path d="M2 3H8M5 3V13"/>', k: '<path d="M8 3L2 8L8 13"/>', m: '<path d="M2 13V7Q5 1 8 7V13"/>', n: '<path d="M1.5 8Q3.25 4.5 5 8T8.5 8"/>', s: '<path d="M8 3L2 13"/>', h: '<path d="M3 3V13M7 3V13"/>', l: '<path d="M6 3V11Q6 13 3.5 13"/>', w: '<path d="M2 3L5 13L8 3"/>' };
const MARK = { a: '', i: '<circle cx="5" cy="1" r="0.9" class="f"/>', u: '<circle cx="5" cy="15.2" r="0.9" class="f"/>', e: '<path d="M11 6V10"/>', o: '<circle cx="11" cy="8" r="1.3"/>' };
const syl = (w) => [...w.matchAll(/([ptkmnshlw]?)([aiueo])/g)].map((m) => [m[1], m[2]]);
function glyphs(toks, sw = 1.25) {
  let x = 0; const parts = [];
  for (const t of toks) {
    if (t === '.') { parts.push(`<circle cx="${x + 2}" cy="12.5" r="1.1" class="f"/>`); x += 6; continue; }
    if (t === ',') { parts.push(`<path d="M${x + 2.5} 11L${x + 1.5} 14"/>`); x += 6; continue; }
    if (x) x += 4;
    for (const [c, v] of syl(t)) { parts.push(`<g transform="translate(${x} 0)">${BASE[c]}${MARK[v]}</g>`); x += 12; }
  }
  return `<svg viewBox="-1 -1 ${x + 2} 18" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><style>.f{fill:currentColor;stroke:none}</style>${parts.join('')}</svg>`;
}
const R = { dot: { w: 'toto', ja: 'ドット', en: 'Dot', c: '#ffd98a', n: '01' }, lantern: { w: 'lanta', ja: 'ランタン', en: 'Lantern', c: '#9fe8ff', n: '04' }, kame: { w: 'kamemalu', ja: 'カメマル', en: 'Kamemaru', c: '#8fe0bd', n: '03' }, rakko: { w: 'lako', ja: 'ラッコ', en: 'Rakko', c: '#f7a36b', n: '02' } };
