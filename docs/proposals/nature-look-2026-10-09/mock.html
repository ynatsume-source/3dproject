<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#cfe6ee;overflow:hidden;font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif}
#lab{position:absolute;inset:0;pointer-events:none}
.t{position:absolute;transform:translate(-50%,0);font-size:15px;color:#3b3a33;background:rgba(255,253,244,.85);padding:3px 9px;border-radius:10px;white-space:nowrap}
#title{position:absolute;left:22px;top:16px;font-size:20px;color:#2f3b33;background:rgba(255,253,244,.85);padding:6px 12px;border-radius:12px}
</style></head><body><div id="title"></div><div id="lab"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const q = new URLSearchParams(location.search), mode = q.get('mode') || 'hero';
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFShadowMap;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
document.body.prepend(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3ef); scene.fog = new THREE.Fog(0xcfe9ef, 30, 90);
const cam = new THREE.PerspectiveCamera(38, W / H, 0.1, 300);
scene.add(new THREE.HemisphereLight(0xe8f6ff, 0xd8c9a2, 1.25));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.4); sun.position.set(-14, 22, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 6; Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 70 }); sun.shadow.bias = -0.0004;
scene.add(sun);
// a seeded random, so each run is the same picture
let seed = 7; const R = () => ((seed = (seed * 16807) % 2147483647) / 2147483647); const rr = (a, b) => a + (b - a) * R();
const mat = (c, rough = 0.9) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: 0 });
// a soft lump: an icosphere pushed about a little, kept smooth (the 'rounded, friendly' rule: no sharp facets)
function lump(rad, wob = 0.12, detail = 3, squash = 1) {
  const g = new THREE.SphereGeometry(rad, 10 + detail * 6, 8 + detail * 4), p = g.attributes.position, v = new THREE.Vector3();
  const k1 = rr(0, 6), k2 = rr(0, 6);
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); const n = v.clone().normalize(); const w = 1 + wob * (Math.sin(n.x * 3 + k1) * Math.sin(n.z * 3 + k2) + 0.5 * Math.sin(n.y * 5 + k1)); v.copy(n).multiplyScalar(rad * w); v.y *= squash; p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals(); return g;
}
// two-tone: lighter on top, deeper underneath, painted into vertex colours (cheap: no extra light)
function tone(g, top, bottom, y0, y1) {
  const p = g.attributes.position, c = [], A = new THREE.Color(top), B = new THREE.Color(bottom), t = new THREE.Color();
  for (let i = 0; i < p.count; i++) { const k = Math.min(1, Math.max(0, (p.getY(i) - y0) / (y1 - y0))); t.copy(B).lerp(A, k * k * (3 - 2 * k)); c.push(t.r, t.g, t.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3)); return g;
}
const vmat = (rough = 0.95) => new THREE.MeshStandardMaterial({ vertexColors: true, roughness: rough });
function add(m, x, y, z) { m.position.set(x, y, z); m.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); scene.add(m); return m; }
// a trunk: a few tapered, bent segments
function trunk(h, r0, r1, lean, col) {
  const g = new THREE.Group(); let x = 0, y = 0, z = 0; const n = 4;
  for (let i = 0; i < n; i++) { const a = i / n, b = (i + 1) / n, ra = r0 + (r1 - r0) * a, rb = r0 + (r1 - r0) * b, seg = h / n;
    const c = new THREE.Mesh(new THREE.CylinderGeometry(rb, ra, seg * 1.05, 10), mat(col)); const dx = lean * seg * (0.6 + a);
    c.position.set(x + dx / 2, y + seg / 2, z); c.rotation.z = -Math.atan2(dx, seg); g.add(c); x += dx; y += seg; }
  g.userData.top = new THREE.Vector3(x, y, z); return g;
}
// 1 テリハボク: short leaning trunk, a dense rounded crown of a few big soft puffs
function teriha(s = 1) {
  const g = new THREE.Group(), t = trunk(2.2 * s, 0.32 * s, 0.2 * s, 0.25, 0x8a7258); g.add(t); const top = t.userData.top;
  for (const [dx, dy, dz, rad] of [[0, 0.9, 0, 1.55], [1.1, 0.5, 0.3, 1.15], [-1.1, 0.6, -0.2, 1.2], [0.2, 0.55, 1.1, 1.1], [-0.3, 0.6, -1.1, 1.1], [0.3, 1.7, 0.1, 1.0]]) {
    const m = new THREE.Mesh(tone(lump(rad * s, 0.1, 3, 0.8), 0x7fb24a, 0x2f6b34, -rad * s * 0.8, rad * s * 0.8), vmat()); m.position.set(top.x + dx * s, top.y + dy * s, top.z + dz * s); g.add(m); }
  return g;
}
// 2 オオハマボウ: two or three trunks sprawling, a low broad yellow-green crown, a few heart leaves' flowers (yellow dots)
function hau(s = 1) {
  const g = new THREE.Group();
  for (const [ang, lean] of [[0, 0.5], [2.2, 0.45], [4.1, 0.35]]) { const t = trunk(1.6 * s, 0.17 * s, 0.11 * s, lean, 0x7d6a55); t.rotation.y = ang; g.add(t);
    const top = t.userData.top.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), ang);
    for (let k = 0; k < 3; k++) { const rad = rr(0.75, 1.0) * s, m = new THREE.Mesh(tone(lump(rad, 0.12, 3, 0.62), 0xb9d25a, 0x5d8a35, -rad * 0.6, rad * 0.6), vmat()); m.position.set(top.x + rr(-0.6, 0.6) * s, top.y + rr(0, 0.35) * s, top.z + rr(-0.6, 0.6) * s); g.add(m); }
    for (let k = 0; k < 4; k++) { const f = new THREE.Mesh(new THREE.IcosahedronGeometry(0.09 * s, 1), mat(0xf6d24a, 0.6)); f.position.set(top.x + rr(-0.8, 0.8) * s, top.y + rr(0.35, 0.6) * s, top.z + rr(-0.8, 0.8) * s); g.add(f); } }
  return g;
}
// 3 アダン: a stout trunk on prop roots, a rosette of thick, curved, slightly drooping leaves; a pineapple-like fruit
function adan(s = 1) {
  const g = new THREE.Group(), t = trunk(1.5 * s, 0.16 * s, 0.13 * s, 0.15, 0x9a8466); g.add(t); const top = t.userData.top;
  for (let k = 0; k < 5; k++) { const a = k / 5 * 6.28, root = new THREE.Mesh(new THREE.CylinderGeometry(0.035 * s, 0.05 * s, 0.9 * s, 6), mat(0x9a8466)); root.position.set(Math.cos(a) * 0.28 * s, 0.38 * s, Math.sin(a) * 0.28 * s); root.rotation.set(Math.sin(a) * 0.5, 0, -Math.cos(a) * 0.5); g.add(root); }
  for (let k = 0; k < 14; k++) { const a = k / 14 * 6.28 + rr(-0.1, 0.1), len = rr(1.0, 1.3) * s;
    const shape = new THREE.Shape(); shape.moveTo(0, -0.07 * s); shape.quadraticCurveTo(len * 0.5, -0.1 * s, len, 0); shape.quadraticCurveTo(len * 0.5, 0.1 * s, 0, 0.07 * s);
    const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.02 * s, bevelEnabled: true, bevelThickness: 0.02 * s, bevelSize: 0.02 * s, bevelSegments: 2, curveSegments: 8 });
    geo.rotateX(Math.PI / 2);   // (lying flat: length along x, width along z)
    const p = geo.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i); p.setY(i, p.getY(i) - 0.55 * (x / len) ** 2 * len); } geo.computeVertexNormals();   // (drooping toward the tip)
    const leaf = new THREE.Mesh(geo, mat(k % 3 ? 0x6f9f45 : 0x8db558, 0.7)); leaf.rotation.z = 0.6;   // (rising from the crown, then bending down)
    const holder = new THREE.Group(); holder.add(leaf); holder.rotation.y = a; holder.position.copy(top); g.add(holder); }
  const fr = new THREE.Mesh(tone(lump(0.22 * s, 0.05, 2, 1.2), 0xf0a63c, 0xc8672a, -0.25 * s, 0.25 * s), vmat(0.7)); fr.position.set(top.x + 0.2 * s, top.y - 0.25 * s, top.z); g.add(fr);
  return g;
}
// 4 クサトベラ: a low mound of soft round leaf-heaps
function bush(s = 1) {
  const g = new THREE.Group();
  for (let k = 0; k < 6; k++) { const rad = rr(0.35, 0.55) * s, m = new THREE.Mesh(tone(lump(rad, 0.1, 2, 0.75), 0x9cc760, 0x3f7a3a, -rad * 0.7, rad * 0.7), vmat()); m.position.set(rr(-0.55, 0.55) * s, rad * 0.55, rr(-0.55, 0.55) * s); g.add(m); }
  for (let k = 0; k < 5; k++) { const f = new THREE.Mesh(new THREE.IcosahedronGeometry(0.05 * s, 1), mat(0xffffff, 0.6)); f.position.set(rr(-0.6, 0.6) * s, rr(0.5, 0.75) * s, rr(-0.6, 0.6) * s); g.add(f); }
  return g;
}
// 5 a grass tuft: a handful of chunky, curved blades
function tuft(s = 1) {
  const g = new THREE.Group();
  for (let k = 0; k < 9; k++) { const len = rr(0.35, 0.6) * s, b = new THREE.Mesh(new THREE.ConeGeometry(0.035 * s, len, 4, 3), mat(k % 2 ? 0x8fbf55 : 0x6ea34a, 0.8)); const a = k / 9 * 6.28; b.position.set(Math.cos(a) * 0.06 * s, len / 2, Math.sin(a) * 0.06 * s); b.rotation.set(Math.sin(a) * rr(0.2, 0.55), 0, -Math.cos(a) * rr(0.2, 0.55)); g.add(b); }
  return g;
}
// 6 rocks: smooth, rounded, warm grey-beige, two-tone (sun-bleached top)
function rock(s = 1, c1 = 0xd9d0bd, c2 = 0x9c9584) { const m = new THREE.Mesh(tone(lump(s, 0.16, 3, 0.62), c1, c2, -s * 0.5, s * 0.5), vmat(0.85)); return m; }
// 7 driftwood: a bleached, softly rounded log with a stub of a branch
function drift(s = 1) {
  const g = new THREE.Group(), lg = new THREE.CapsuleGeometry(0.13 * s, 1.5 * s, 6, 12), p = lg.attributes.position;
  for (let i = 0; i < p.count; i++) { const y = p.getY(i); p.setX(i, p.getX(i) + 0.06 * Math.sin(y * 2.5)); } lg.computeVertexNormals();
  const m = new THREE.Mesh(lg, mat(0xd9cdb6, 0.8)); m.rotation.z = Math.PI / 2; g.add(m);
  const st = new THREE.Mesh(new THREE.CapsuleGeometry(0.06 * s, 0.35 * s, 4, 8), mat(0xcfc1a8, 0.8)); st.position.set(0.3 * s, 0.15 * s, 0.12 * s); st.rotation.set(0.7, 0, 0.6); g.add(st); return g;
}
// 8 shell: a little spiral cone; 9 coconut: a husked oval
function shell(s = 1) { const g = new THREE.Group(); for (let k = 0; k < 5; k++) { const m = new THREE.Mesh(new THREE.SphereGeometry((0.09 - k * 0.014) * s, 16, 12), mat(k % 2 ? 0xf3d9c2 : 0xe9b99a, 0.55)); m.position.set(k * 0.05 * s, k * 0.035 * s, 0); g.add(m); } return g; }
function coco(s = 1) { const m = new THREE.Mesh(tone(lump(0.17 * s, 0.05, 3, 1.15), 0xa7814f, 0x6b4d2c, -0.2 * s, 0.2 * s), vmat(0.85)); return m; }
// the ground: sand with a soft grass verge, a lagoon edge
const groundG = new THREE.PlaneGeometry(120, 120, 120, 120); groundG.rotateX(-Math.PI / 2);
{ const p = groundG.attributes.position, c = [], sand = new THREE.Color(0xf1e3c4), grass = new THREE.Color(0x9cc466), wet = new THREE.Color(0xd8c9a6), t = new THREE.Color();
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); const y = 0.25 * Math.sin(x * 0.15) * Math.cos(z * 0.13) + (z < -6 ? (z + 6) * 0.06 : 0); p.setY(i, y);
    const gk = Math.min(1, Math.max(0, (-z - 3) / 6 + 0.3 * Math.sin(x * 0.4))), wk = Math.min(1, Math.max(0, (z - 9) / 3)); t.copy(sand).lerp(grass, gk).lerp(wet, wk); c.push(t.r, t.g, t.b); }
  groundG.setAttribute('color', new THREE.Float32BufferAttribute(c, 3)); groundG.computeVertexNormals(); }
const ground = new THREE.Mesh(groundG, vmat(1)); ground.receiveShadow = true; scene.add(ground);
const sea = new THREE.Mesh(new THREE.PlaneGeometry(200, 60), new THREE.MeshStandardMaterial({ color: 0x5fc6c9, roughness: 0.15, metalness: 0, transparent: true, opacity: 0.85 })); sea.rotation.x = -Math.PI / 2; sea.position.set(0, 0.05, 41); scene.add(sea);
const labels = [];
const label = (txt, obj, dy = 0) => labels.push([txt, obj, dy]);
if (mode === 'hero') {
  document.getElementById('title').textContent = '方向のイメージ（モック）：丸っこく、親しみやすく、でも八重山の海岸林';
  add(teriha(1.15), -7, 0, -9); add(teriha(0.9), -12, 0, -6); add(hau(1.1), 5.5, 0, -8); add(hau(0.8), 10, 0, -11); add(adan(1.0), -2.2, 0, -3.5); add(adan(0.8), 8, 0, -2.5);
  for (const [x, z, s] of [[2, -2, 0.9], [-5, -1, 0.8], [11, -5, 1.0], [-10, -2, 0.9]]) add(bush(s), x, 0, z);
  for (let k = 0; k < 40; k++) add(tuft(rr(0.7, 1.1)), rr(-14, 14), 0, rr(-12, -1));
  for (const [x, z, s] of [[3.5, 4, 0.55], [4.6, 4.4, 0.32], [-4, 6, 0.45], [7.5, 7, 0.7], [-8, 8, 0.4], [0.5, 9, 0.35]]) add(rock(s), x, s * 0.2, z);
  add(drift(1), -1.5, 0.12, 5.5).rotation.y = 0.4; add(shell(1), 1.2, 0.05, 6.8); add(shell(0.8), 1.6, 0.05, 7.1).rotation.y = 1; add(coco(1), -3.2, 0.17, 3.4); add(coco(0.9), -2.8, 0.15, 3.8);
  cam.position.set(1.0, 2.2, 13); cam.lookAt(0, 1.4, -4);
} else {
  document.getElementById('title').textContent = 'もの一覧（モック）：形と色の方向。大きさの比は実物に合わせない';
  scene.fog = null; ground.visible = false; sea.visible = false;
  const floor = new THREE.Mesh(new THREE.CircleGeometry(40, 64), mat(0xf4ead2, 1)); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const row = [['テリハボク', teriha(0.55), 0], ['オオハマボウ', hau(0.6), 0], ['アダン', adan(0.75), 0], ['クサトベラ', bush(0.9), 0], ['草の株', tuft(1.4), 0], ['浜の石', rock(0.55), 0.1], ['流木', drift(0.9), 0.1], ['貝殻・ヤシの実', (() => { const g = new THREE.Group(); const a = shell(2.2); a.position.set(-0.35, 0.1, 0); g.add(a); const b = coco(2.2); b.position.set(0.45, 0.35, 0); g.add(b); return g; })(), 0]];
  row.forEach(([n, o, y], i) => { const x = (i - 3.5) * 2.15; add(o, x, y, 0); label(n, o, 0); });
  cam.position.set(0, 2.6, 11.5); cam.fov = 50; cam.updateProjectionMatrix(); cam.lookAt(0, 0.8, 0); sun.position.set(-10, 18, 14);
}
r.render(scene, cam);
// labels under each thing (list mode)
const box = new THREE.Box3(), v = new THREE.Vector3();
for (const [txt, obj] of labels) { box.setFromObject(obj); v.set((box.min.x + box.max.x) / 2, box.min.y, box.max.z).project(cam); const d = document.createElement('div'); d.className = 't'; d.textContent = txt; d.style.left = ((v.x + 1) / 2 * W) + 'px'; d.style.top = ((1 - v.y) / 2 * H + 12) + 'px'; document.getElementById('lab').appendChild(d); }
window.DONE = true;
</script></body></html>
