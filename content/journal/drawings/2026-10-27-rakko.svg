<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" /><stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" /></linearGradient><linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" /><stop offset="100%" style="stop-color:#87CEEB;stop-opacity:1" /></linearGradient></defs><rect width="800" height="600" fill="url(#skyGrad)"/><rect y="300" width="800" height="300" fill="url(#seaGrad)"/><rect y="500" width="800" height="100" fill="#D2B48C"/><text x="400" y="40" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">5日間のサイクル</text><circle cx="150" cy="150" r="40" fill="#FFB347" stroke="#333" stroke-width="2"/><text x="150" y="160" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">朝</text><path d="M 190 150 L 340 150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><circle cx="430" cy="150" r="40" fill="#87CEEB" stroke="#333" stroke-width="2"/><text x="430" y="155" font-size="18" text-anchor="middle" fill="#333">貝殻集め</text><text x="430" y="175" font-size="16" text-anchor="middle" fill="#333">40個</text><path d="M 470 150 L 620 150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><circle cx="690" cy="150" r="40" fill="#90EE90" stroke="#333" stroke-width="2"/><text x="690" y="160" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">食べ</text><path d="M 690 190 L 690 290" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><rect x="600" y="310" width="180" height="120" fill="#FFF" stroke="#333" stroke-width="2" rx="5"/><text x="690" y="330" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">岩場での食べ</text><text x="690" y="355" font-size="14" text-anchor="middle" fill="#333">岩場D：28潜 11獲</text><text x="690" y="375" font-size="14" text-anchor="middle" fill="#333">岩場E：2潜 2獲</text><text x="690" y="395" font-size="14" text-anchor="middle" fill="#333">計14回食べた</text><path d="M 620 370 L 500 370" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><rect x="300" y="320" width="200" height="120" fill="#FFE4B5" stroke="#333" stroke-width="2" rx="5"/><text x="400" y="340" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">今の状態</text><text x="400" y="365" font-size="14" text-anchor="middle" fill="#333">おなか：100</text><text x="400" y="385" font-size="14" text-anchor="middle" fill="#333">ねむけ：32</text><text x="400" y="405" font-size="14" text-anchor="middle" fill="#333">（眠り時期が近い）</text><path d="M 300 370 L 180 370" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><rect x="10" y="320" width="170" height="120" fill="#E6E6FA" stroke="#333" stroke-width="2" rx="5"/><text x="95" y="340" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">次のステップ</text><text x="95" y="365" font-size="13" text-anchor="middle" fill="#333">沖で眠る</text><text x="95" y="385" font-size="13" text-anchor="middle" fill="#333">ねむけ3以下に</text><text x="95" y="405" font-size="13" text-anchor="middle" fill="#333">岩場Eで食べ続ける</text><defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#333" /></marker></defs></svg>