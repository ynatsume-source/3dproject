<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f3f8"/><stop offset="1" stop-color="#f6f0e0"/></linearGradient></defs><rect width="800" height="600" fill="url(#bg)"/><text x="400" y="50" font-size="28" text-anchor="middle" fill="#333">小屋の残り2部材と流木の手がかり</text><text x="60" y="110" font-size="20" fill="#333">小屋の進み具合 22/24</text><g transform="translate(60,125)"><rect x="0" y="0" width="680" height="36" fill="#fff" stroke="#666"/><rect x="0" y="0" width="623" height="36" fill="#8bb174"/><rect x="623" y="0" width="28" height="36" fill="#f2d38a" stroke="#666"/><rect x="651" y="0" width="29" height="36" fill="#f2d38a" stroke="#666"/><text x="300" y="25" font-size="18" fill="#fff" text-anchor="middle">取りつけ済み 22</text><text x="650" y="62" font-size="16" fill="#333" text-anchor="middle">残り 2</text></g><text x="60" y="240" font-size="20" fill="#333">ラッコから聞いた流木の距離（向きは不明）</text><line x1="80" y1="330" x2="740" y2="330" stroke="#555" stroke-width="3"/><circle cx="80" cy="330" r="14" fill="#555"/><text x="80" y="370" font-size="16" text-anchor="middle" fill="#333">小屋 0m</text><line x1="80" y1="320" x2="80" y2="340" stroke="#555"/><rect x="545" y="312" width="50" height="14" rx="6" fill="#a0754a"/><text x="570" y="300" font-size="18" text-anchor="middle" fill="#333">約67m</text><rect x="715" y="312" width="50" height="14" rx="6" fill="#a0754a"/><text x="740" y="300" font-size="18" text-anchor="middle" fill="#333">約90m</text><text x="60" y="430" font-size="20" fill="#333">明日の手順</text><g font-size="17" fill="#333"><rect x="60" y="450" width="150" height="60" rx="8" fill="#fff" stroke="#666"/><text x="135" y="486" text-anchor="middle">67mを拾う</text><rect x="240" y="450" width="150" height="60" rx="8" fill="#fff" stroke="#666"/><text x="315" y="486" text-anchor="middle">90mを拾う</text><rect x="420" y="450" width="150" height="60" rx="8" fill="#fff" stroke="#666"/><text x="495" y="486" text-anchor="middle">削る・取りつけ</text><rect x="600" y="450" width="150" height="60" rx="8" fill="#8bb174" stroke="#666"/><text x="675" y="486" text-anchor="middle" fill="#fff">24/24</text></g><g stroke="#666" stroke-width="2"><line x1="212" y1="480" x2="236" y2="480"/><line x1="392" y1="480" x2="416" y2="480"/><line x1="572" y1="480" x2="596" y2="480"/></g><text x="60" y="560" font-size="16" fill="#555">気圧計：49回読んで目盛り-4（ランタンの話）。意味はまだ確かめていない。</text></svg>