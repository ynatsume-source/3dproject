<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect width="800" height="600" fill="#eef4f7"/><text x="40" y="60" font-size="30" fill="#223">今日のドット：小屋づくりの記録</text><text x="40" y="120" font-size="22" fill="#223">小屋の進み具合 22/24</text><rect x="40" y="135" width="720" height="36" fill="#fff" stroke="#556" stroke-width="2"/><rect x="40" y="135" width="660" height="36" fill="#c9a66b"/><text x="705" y="160" font-size="18" fill="#556">残り2</text><line x1="60" y1="260" x2="740" y2="260" stroke="#556" stroke-width="3"/><text x="40" y="230" font-size="20" fill="#223">今日の流れ</text><g fill="#6fa8dc"><circle cx="80" cy="260" r="9"/><circle cx="200" cy="260" r="9"/><circle cx="240" cy="260" r="9"/><circle cx="270" cy="260" r="9"/><circle cx="300" cy="260" r="9"/><circle cx="360" cy="260" r="9"/><circle cx="380" cy="260" r="9"/><circle cx="400" cy="260" r="9"/><circle cx="420" cy="260" r="9"/><circle cx="455" cy="260" r="9"/></g><text x="80" y="300" font-size="16" fill="#223">11:14</text><text x="420" y="300" font-size="16" fill="#223">16:44</text><text x="120" y="330" font-size="18" fill="#336">ラッコに流木運びを依頼 10回／運ばれた記録なし</text><g fill="#d9534f"><rect x="640" y="250" width="16" height="20"/><rect x="662" y="250" width="16" height="20"/><rect x="684" y="250" width="16" height="20"/></g><text x="620" y="300" font-size="16" fill="#223">18:51-18:53</text><text x="560" y="330" font-size="18" fill="#a33">削る 3回失敗：道がなかった</text><text x="40" y="410" font-size="20" fill="#223">次の手順</text><rect x="40" y="430" width="220" height="90" rx="10" fill="#fff" stroke="#556" stroke-width="2"/><text x="60" y="470" font-size="18" fill="#223">1. 作業台までの</text><text x="80" y="498" font-size="18" fill="#223">道を確かめる</text><rect x="290" y="430" width="220" height="90" rx="10" fill="#fff" stroke="#556" stroke-width="2"/><text x="310" y="470" font-size="18" fill="#223">2. 流木を</text><text x="330" y="498" font-size="18" fill="#223">自分で拾う</text><rect x="540" y="430" width="220" height="90" rx="10" fill="#fff" stroke="#556" stroke-width="2"/><text x="560" y="470" font-size="18" fill="#223">3. 削る→取りつけ</text><text x="580" y="498" font-size="18" fill="#223">24/24へ</text><path d="M262 475 L286 475 M278 467 L286 475 L278 483" stroke="#556" stroke-width="3" fill="none"/><path d="M512 475 L536 475 M528 467 L536 475 L528 483" stroke="#556" stroke-width="3" fill="none"/><text x="40" y="570" font-size="14" fill="#667">22/24は当たりの記録の値。電池と持ち物は今日の記録にない。</text></svg>