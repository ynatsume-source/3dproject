<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f1f5"/><stop offset="1" stop-color="#f7f3e8"/></linearGradient></defs><rect width="800" height="600" fill="url(#bg)"/><text x="400" y="44" font-size="26" text-anchor="middle" fill="#333">帆づくりの段と今日の結果</text><g font-size="18" text-anchor="middle"><rect x="40" y="90" width="130" height="70" rx="10" fill="#bfe3c0" stroke="#4a8a4c"/><text x="105" y="122">葉を取る</text><text x="105" y="146" fill="#2d6a2f">済</text><rect x="190" y="90" width="130" height="70" rx="10" fill="#bfe3c0" stroke="#4a8a4c"/><text x="255" y="122">細く裂く</text><text x="255" y="146" fill="#2d6a2f">済</text><rect x="340" y="90" width="130" height="70" rx="10" fill="#bfe3c0" stroke="#4a8a4c"/><text x="405" y="122">軒下に干す</text><text x="405" y="146" fill="#2d6a2f">広げた</text><rect x="490" y="90" width="130" height="70" rx="10" fill="#f3e0b5" stroke="#b08a3a" stroke-dasharray="6 4"/><text x="555" y="122">むしろを編む</text><text x="555" y="146" fill="#8a6420">手順が出ない</text><rect x="640" y="90" width="120" height="70" rx="10" fill="#eee" stroke="#999" stroke-dasharray="6 4"/><text x="700" y="130" fill="#777">帆</text></g><g stroke="#666" stroke-width="2"><line x1="170" y1="125" x2="190" y2="125"/><line x1="320" y1="125" x2="340" y2="125"/><line x1="470" y1="125" x2="490" y2="125"/><line x1="620" y1="125" x2="640" y2="125"/></g><g font-size="16" fill="#444"><text x="40" y="200">仮説と結果</text><text x="40" y="228">当たり：日が高くなってから充電する → 32%から7割へ</text><text x="40" y="254">外れ：先に裂けば干せる → 干す手順が止まった</text><text x="40" y="280">外れ：部材を置けば編める → 編む手順が消えた</text><text x="40" y="306">結果：材料を脇に片付けたら、干す手順が通った</text></g><text x="40" y="350" font-size="18" fill="#333">殻から繊維を取る</text><g font-size="15" text-anchor="middle"><rect x="40" y="365" width="120" height="44" rx="8" fill="#bfe3c0"/><text x="100" y="393">浸ける</text><rect x="180" y="365" width="120" height="44" rx="8" fill="#bfe3c0"/><text x="240" y="393">引き上げる</text><rect x="320" y="365" width="120" height="44" rx="8" fill="#f2c0b8"/><text x="380" y="393">打つ：硬い</text><rect x="460" y="365" width="140" height="44" rx="8" fill="#f3e0b5"/><text x="530" y="393">浸け直し中</text></g><text x="40" y="460" font-size="18" fill="#333">渡れる距離</text><rect x="40" y="478" width="720" height="26" fill="#dde" rx="4"/><rect x="40" y="478" width="291" height="26" fill="#7aa6c8" rx="4"/><text x="185" y="497" font-size="14" text-anchor="middle" fill="#fff">筏 約4km</text><line x1="760" y1="470" x2="760" y2="512" stroke="#c0504d" stroke-width="3"/><text x="755" y="532" font-size="15" text-anchor="end" fill="#c0504d">une 9.9km</text><text x="40" y="575" font-size="14" fill="#666">帆ができれば、もっと遠くへ届くかもしれない（未確認）</text></svg>