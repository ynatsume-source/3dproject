<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f1f5"/><stop offset="1" stop-color="#f7f3e8"/></linearGradient></defs><rect width="800" height="600" fill="url(#bg)"/><text x="40" y="50" font-size="26" fill="#223" font-family="sans-serif">家の進み具合と今日の流れ</text><text x="40" y="100" font-size="18" fill="#334" font-family="sans-serif">家</text><rect x="90" y="82" width="640" height="26" fill="#ddd" stroke="#556"/><rect x="90" y="82" width="579" height="26" fill="#9bb"/><rect x="669" y="82" width="61" height="26" fill="#e9a23b"/><text x="560" y="130" font-size="15" fill="#334" font-family="sans-serif">朝 38/42 → 今日 42/42</text><line x1="60" y1="230" x2="760" y2="230" stroke="#556" stroke-width="3"/><g font-family="sans-serif" font-size="14" fill="#223"><circle cx="90" cy="230" r="9" fill="#c55"/><text x="60" y="200">7.6/7.9時</text><text x="55" y="265">渡航×早い</text><circle cx="230" cy="230" r="9" fill="#5a5"/><text x="200" y="200">9:35</text><text x="185" y="265">sopunu 1回目</text><circle cx="330" cy="230" r="9" fill="#5a5"/><text x="305" y="200">10:06</text><text x="300" y="265">土壁 39</text><circle cx="410" cy="230" r="9" fill="#5a5"/><text x="385" y="200">10:14</text><text x="370" y="285">sopunu 2回目</text><circle cx="490" cy="230" r="9" fill="#5a5"/><text x="465" y="200">10:51</text><text x="465" y="265">土壁 40</text><circle cx="580" cy="230" r="11" fill="#e9a23b"/><text x="555" y="200">11:34</text><text x="545" y="265">台 42/42</text><circle cx="700" cy="230" r="11" fill="#557"/><text x="675" y="200">15:43</text><text x="680" y="265">台風</text></g><rect x="40" y="330" width="340" height="220" rx="10" fill="#fff" stroke="#9bb"/><text x="60" y="365" font-size="18" fill="#223" font-family="sans-serif">確かめたこと</text><text x="60" y="400" font-size="15" fill="#334" font-family="sans-serif">・朝早い渡航は断られる</text><text x="60" y="430" font-size="15" fill="#334" font-family="sans-serif">・9時台に作業を挟まず選ぶと通る</text><text x="60" y="460" font-size="15" fill="#334" font-family="sans-serif">・粘土をそろえれば土壁は塗れる</text><text x="60" y="490" font-size="15" fill="#334" font-family="sans-serif">・電池0.6でも台は作れた</text><rect x="420" y="330" width="340" height="220" rx="10" fill="#fff" stroke="#c88"/><text x="440" y="365" font-size="18" fill="#223" font-family="sans-serif">台風で失ったもの → 次</text><text x="440" y="400" font-size="15" fill="#334" font-family="sans-serif">・茅1段 → 張り直す</text><text x="440" y="430" font-size="15" fill="#334" font-family="sans-serif">・畑の作物6区画 → まき直す</text><text x="440" y="460" font-size="15" fill="#334" font-family="sans-serif">・筏の部材3本 → 作り直す</text><text x="440" y="490" font-size="15" fill="#334" font-family="sans-serif">・浜の見慣れないもの → 見に行く</text></svg>