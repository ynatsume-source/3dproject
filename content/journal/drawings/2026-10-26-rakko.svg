<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" /><stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" /></linearGradient><linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#F4A460;stop-opacity:1" /><stop offset="100%" style="stop-color:#D2B48C;stop-opacity:1" /></linearGradient></defs><rect width="800" height="600" fill="url(#seaGrad)"/><rect y="450" width="800" height="150" fill="url(#sandGrad)"/><text x="400" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">5日間のサイクル</text><circle cx="150" cy="120" r="40" fill="#FFE4B5" stroke="#333" stroke-width="2"/><text x="150" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">寝る</text><text x="150" y="200" font-size="12" text-anchor="middle" fill="#333">ねむけ3以下に</text><circle cx="400" cy="120" r="40" fill="#90EE90" stroke="#333" stroke-width="2"/><text x="400" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">岩場E</text><text x="400" y="200" font-size="12" text-anchor="middle" fill="#333">成功率0.56以上</text><circle cx="650" cy="120" r="40" fill="#FFB6C1" stroke="#333" stroke-width="2"/><text x="650" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">貝殻集め</text><text x="650" y="200" font-size="12" text-anchor="middle" fill="#333">役割として継続</text><path d="M 190 120 L 360 120" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/><path d="M 440 120 L 610 120" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/><path d="M 650 160 Q 400 300 150 160" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/><text x="400" y="310" font-size="13" text-anchor="middle" fill="#333">毎日繰り返す</text><rect x="50" y="380" width="700" height="50" fill="#FFFACD" stroke="#333" stroke-width="2" rx="5"/><text x="400" y="405" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">成果：岩場Eで15回中12回成功（80%）/ 岩場Dで24回中17回成功（71%）</text><text x="400" y="422" font-size="12" text-anchor="middle" fill="#333">貝殻を浜に多数並べて役割を果たした</text><defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#333" /></marker></defs></svg>