<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#87ceeb;stop-opacity:1" /><stop offset="100%" style="stop-color:#1e90ff;stop-opacity:1" /></linearGradient><linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#f4a460;stop-opacity:1" /><stop offset="100%" style="stop-color:#daa520;stop-opacity:1" /></linearGradient></defs><rect width="800" height="600" fill="url(#seaGrad)"/><rect y="450" width="800" height="150" fill="url(#sandGrad)"/><text x="400" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="white">5日間のサイクル：海底のサンゴ石を拾い続ける</text><g><rect x="100" y="100" width="150" height="100" fill="#fff8dc" stroke="#8b7355" stroke-width="2" rx="5"/><text x="175" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">海底でサンゴ石を拾う</text><text x="175" y="155" font-size="12" text-anchor="middle" fill="#333">1日3～4個</text><text x="175" y="175" font-size="12" text-anchor="middle" fill="#333">浜に置く</text></g><g><rect x="350" y="100" width="150" height="100" fill="#fffacd" stroke="#8b7355" stroke-width="2" rx="5"/><text x="425" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">浜に集める</text><text x="425" y="155" font-size="12" text-anchor="middle" fill="#333">5日で16個</text><text x="425" y="175" font-size="12" text-anchor="middle" fill="#333">運ぶ準備</text></g><g><rect x="600" y="100" width="150" height="100" fill="#f0e68c" stroke="#8b7355" stroke-width="2" rx="5"/><text x="675" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">ドットの家へ運ぶ</text><text x="675" y="155" font-size="12" text-anchor="middle" fill="#333">石垣が進む</text><text x="675" y="175" font-size="12" text-anchor="middle" fill="#333">3/24→16/24</text></g><path d="M 250 150 L 350 150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><path d="M 500 150 L 600 150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/><path d="M 675 210 Q 675 280 425 350" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/><defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#333" /></marker></defs><g><rect x="100" y="380" width="600" height="50" fill="#fff" stroke="#333" stroke-width="1" rx="3"/><text x="400" y="405" font-size="13" text-anchor="middle" fill="#333">貝殻も並べる：5日で34個 → 役割を毎日続ける</text></g></svg>