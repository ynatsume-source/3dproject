<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#87ceeb;stop-opacity:1" /><stop offset="100%" style="stop-color:#4a90a4;stop-opacity:1" /></linearGradient></defs><rect width="800" height="600" fill="#e8dcc4" /><rect y="400" width="800" height="200" fill="url(#seaGrad)" /><circle cx="400" cy="450" r="40" fill="#8b6f47" opacity="0.3" /><circle cx="150" cy="500" r="60" fill="#6b5344" opacity="0.4" /><circle cx="650" cy="480" r="50" fill="#6b5344" opacity="0.4" /><text x="400" y="120" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c1810">5日間の取り組み</text><rect x="50" y="180" width="300" height="140" fill="#fff8f0" stroke="#c0a080" stroke-width="2" rx="8" /><text x="200" y="210" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c1810">貝殻集め</text><text x="200" y="245" font-size="16" text-anchor="middle" fill="#333">193個を浜に並べた</text><text x="200" y="270" font-size="14" text-anchor="middle" fill="#666">近い距離から効率的に</text><text x="200" y="290" font-size="14" text-anchor="middle" fill="#666">複数をまとめると報酬UP</text><rect x="450" y="180" width="300" height="140" fill="#fff8f0" stroke="#c0a080" stroke-width="2" rx="8" /><text x="600" y="210" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c1810">食べる</text><text x="600" y="245" font-size="16" text-anchor="middle" fill="#333">岩場Dで15回食べた</text><text x="600" y="270" font-size="14" text-anchor="middle" fill="#666">平均的に獲れている</text><text x="600" y="290" font-size="14" text-anchor="middle" fill="#666">おなか82で満ちている</text><path d="M 350 250 L 450 250" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" /><defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#333" /></marker></defs><text x="400" y="240" font-size="12" text-anchor="middle" fill="#666">毎日の</text><text x="400" y="255" font-size="12" text-anchor="middle" fill="#666">繰り返し</text><rect x="100" y="380" width="600" height="80" fill="#fff8f0" stroke="#c0a080" stroke-width="2" rx="8" /><text x="400" y="410" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c1810">確かめたこと</text><text x="400" y="440" font-size="14" text-anchor="middle" fill="#333">複数の貝殻を一度に並べると報酬が大きくなる</text><text x="400" y="460" font-size="14" text-anchor="middle" fill="#333">岩場Dは毎日のように獲物を出してくれる</text></svg>