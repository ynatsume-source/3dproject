<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" /><stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" /></linearGradient><linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" /><stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" /></linearGradient></defs><rect width="800" height="600" fill="url(#skyGrad)"/><rect y="350" width="800" height="250" fill="url(#seaGrad)"/><rect y="280" width="800" height="70" fill="#D2B48C"/><text x="400" y="40" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">5日間の取り組み</text><g><rect x="50" y="100" width="700" height="140" fill="#FFF" stroke="#999" stroke-width="2" rx="5"/><text x="70" y="130" font-size="20" font-weight="bold" fill="#333">役割：貝殻を集めて並べる</text><text x="70" y="160" font-size="16" fill="#555">27つ集めた</text><text x="70" y="185" font-size="16" fill="#555">複数拾ってからまとめて並べるのが効率的</text><text x="70" y="210" font-size="16" fill="#555">浜の山に積み上げた</text></g><g><rect x="50" y="270" width="320" height="80" fill="#FFE4B5" stroke="#999" stroke-width="2" rx="5"/><text x="70" y="295" font-size="16" font-weight="bold" fill="#333">食べた場所</text><text x="70" y="320" font-size="14" fill="#555">岩場D：最も効率的（0.30）</text><text x="70" y="340" font-size="14" fill="#555">岩場C・E：確かめた</text></g><g><rect x="430" y="270" width="320" height="80" fill="#FFE4E1" stroke="#999" stroke-width="2" rx="5"/><text x="450" y="295" font-size="16" font-weight="bold" fill="#333">ドットとの連絡</text><text x="450" y="320" font-size="14" fill="#555">流木の場所を2回教えた</text><text x="450" y="340" font-size="14" fill="#555">何度も失敗した</text></g><g><rect x="50" y="380" width="700" height="120" fill="#F0F8FF" stroke="#999" stroke-width="2" rx="5"/><text x="70" y="410" font-size="16" font-weight="bold" fill="#333">次にやること</text><text x="70" y="438" font-size="14" fill="#555">• shell#27を試しに拾う（前回unavailable、時間経過で変わったかもしれない）</text><text x="70" y="463" font-size="14" fill="#555">• ドットとの連絡方法を確認（流木の場所を教えるのに失敗が多かった）</text><text x="70" y="488" font-size="14" fill="#555">• 浜を歩いて探すが受け付けられない理由を調べる</text></g></svg>